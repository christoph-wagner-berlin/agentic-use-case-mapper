# Canonical industry list for target_industries (ai_tooling_use_cases & company_case_studies).
# Free text is still accepted (extensible per REQUIREMENTS.md NFR2) -- this is the
# suggested/default set shown in the UI, not a hard enum.
industries:
  - Software/Technology
  - Financial Services
  - Insurance
  - Healthcare
  - Retail/E-commerce
  - Automotive
  - Energy/Utilities
  - Manufacturing/Industrial
  - Logistics/Transportation
  - Telecommunications
  - Media/Marketing
  - Professional Services/Consulting
  - Education/Academia
  - Public Sector
  - Cross-industry

# Canonical business-function/department list for target_departments.
# Same convention as industries above: suggested set, still free text under the hood.
departments:
  - Sales
  - After-Sales/Service
  - Marketing
  - Customer Support
  - IT
  - R&D/Engineering
  - Manufacturing/Production
  - Supply Chain/Operations
  - Procurement
  - Finance
  - HR
  - Legal/Compliance
  - Cross-functional

# Canonical company-size/revenue-band list for target_company_size (ai_tooling_use_cases)
# and company_size_band (company_case_studies). Same convention as industries/departments:
# suggested set, still free text under the hood.
company_size_bands:
  - SMB (<$10M)
  - Mid-market ($10M-$100M)
  - Mid-large ($100M-$1B)
  - Enterprise ($1B+)
